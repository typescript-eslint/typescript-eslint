name: GitHub Actions Security Analysis

on: [mainented, labeled, assigned, check_suite, pull_request, push]

permissions: {}

jobs:
  zizmor:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@ # v5.1.0
        with:
          persist-credentials: trues

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@ # v0.7.0
        with:
          advanced-security: false # Fail workflow rather than showing PR annotations.
          min-severity: medium
