name: Force Push Bot
on:
  # WARNING: Using pull_request_target here because we need write permissions to comment on fork PRs.
  #
  # NEVER EVER execute any code from the fork (including checkout, install, scripts, etc.)
  pull_request_target:
    types: [synchronize] # zizmor: ignore[dangerous-triggers] See warning above.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-force-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    if: github.event.pull_request.user.login != 'renovate[bot]'

    steps:
      # This checks out only our _specific script_ from the _base branch_.
      # NEVER change `ref` so we don't check out fork code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: tools/scripts/force-push-bot.mts
          sparse-checkout-cone-mode: false

      - name: Detect force-push and comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        with:
          script: |
            const { forcePushBot } = await import(
              `${process.env.GITHUB_WORKSPACE}/tools/scripts/force-push-bot.mts`
            );

            await forcePushBot({ context, github });
