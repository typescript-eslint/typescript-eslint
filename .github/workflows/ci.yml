# NOTE: The name of this workflow is significant - it is used as the identifier for the workflow_run trigger in the release workflow
name: CI

on:
  push:
    branches:
      - main
  # NOTE: Never use pull_request_target here because that would populate secrets for forks
  pull_request:
    branches:
      - '**'
  merge_group:

concurrency:
  group: '${{ github.workflow }} - ${{ github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PRIMARY_NODE_VERSION: 24
  # Value will be controlled via GitHub environment (called "main") secret, will be read-write for main branch, read-only for other branches
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  # This increases the verbosity of the logs for everything, including Nx Cloud, but will hopefully surface more info about recent lint failures
  NX_VERBOSE_LOGGING: false

defaults:
  run:
    shell: bash

#
# Workflow for how the CI spawns jobs:
# 1) The `main` job starts an Nx Cloud CI run and distributes all Linux Nx
#    task execution onto Nx Agents (see .nx/ci-config.yaml and
#    .nx/workflows/agents.yaml): build, typecheck, lint,
#    attw-check, unit + integration tests, the Node 18 eslint-plugin shards
#    (test --configuration=node18) and the project-service test variants
#    (test --configuration=project-service), which assignment rules route to
#    a Node 18 agent tier. Non-Nx checks (prettier, cspell, markdownlint,
#    stylelint, dedupe, knip) run on the coordinator, recorded via
#    `nx-cloud record`. generate-configs runs coordinator-local because its
#    check inspects the local working tree via git.
# 2) Windows matrices and the snapshot-cleanliness checks (which mutate +
#    inspect the local working tree) remain as regular GitHub-hosted jobs.
#

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  affected-for-github-hosted-tests:
    name: Determine Affected Projects for GitHub-hosted Tests
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    runs-on: ubuntu-latest
    env:
      NX_CI_EXECUTION_ENV: 'ubuntu-latest'
    outputs:
      is_plugin_affected: ${{ steps.filter.outputs.is_plugin_affected }}
      unit_tests_packages: ${{ steps.filter.outputs.unit_tests_packages }}
      windows_unit_tests_packages: ${{ steps.filter.outputs.windows_unit_tests_packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Get affected projects
        id: affected
        run: |
          # Fetch base ref history so NX can determine affected projects
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "$BASE_REF"
            BASE="origin/$BASE_REF"
          else
            BASE="HEAD~1"
          fi

          affected=$(pnpm exec nx show projects --affected --withTarget=test --json --base="$BASE" 2>/dev/null || echo '[]')

          echo "affected=$affected" >> "$GITHUB_OUTPUT"
        env:
          BASE_REF: ${{ github.base_ref }}

      # We want to skip non-affected packages, but GH Actions doesn't support `contains(affected, matrix.package)` in `if` conditions,
      # so we're creating the whole matrix dynamically instead.
      - name: Filter affected packages for test matrices
        id: filter
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const affected = ${{ steps.affected.outputs.affected }};

            // `eslint-plugin` runs in its own sharded job; gate it with a boolean.
            const isPluginAffected = affected.includes('eslint-plugin');

            const affectedUnitTests = affected.filter((pkg) => pkg !== 'eslint-plugin');

            // Packages that have no (or we don't care about their) platform-specific,
            // runtime behavior, so skipping them on Windows to have fewer jobs to run.
            const windowsSkippedPackages = [
              'ast-spec',
              'eslint-plugin-internal',
              'rule-schema-to-typescript-types',
              'scope-manager',
              'utils',
              'visitor-keys',
            ];
            const affectedWindowsUnitTests = affectedUnitTests.filter((pkg) => !windowsSkippedPackages.includes(pkg));

            core.setOutput('is_plugin_affected', isPluginAffected);
            core.setOutput('unit_tests_packages', JSON.stringify(affectedUnitTests));
            core.setOutput('windows_unit_tests_packages', JSON.stringify(affectedWindowsUnitTests));

  main:
    name: Nx Agents Main Job
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    runs-on: ubuntu-latest
    env:
      # This value keys the `overrides` section of .nx/ci-config.yaml — it is
      # what enables distributed execution for this job and nothing else.
      NX_CI_EXECUTION_ENV: 'nx-agents-main'
      NX_CLOUD_CONTINUOUS_ASSIGNMENT: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Derive SHAs for nx affected commands
        run: |
          # Fetch base ref history so NX can determine affected projects
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "$BASE_REF"
            echo "NX_BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
          else
            echo "NX_BASE=HEAD~1" >> "$GITHUB_ENV"
          fi
          echo "NX_HEAD=HEAD" >> "$GITHUB_ENV"
        env:
          BASE_REF: ${{ github.base_ref }}

      # All distribution, lifecycle and env-var forwarding configuration lives
      # in .nx/ci-config.yaml.
      - name: Start Nx Agents
        run: pnpm exec nx-cloud start-nx-agents

      # Non-Nx checks run locally on this job and are recorded to Nx Cloud.
      # None of these need the build.
      - name: Run Spell Check
        run: pnpm exec nx-cloud record -- pnpm run check-spelling

      - name: Run Format Check
        run: pnpm exec nx-cloud record -- pnpm run check-format

      - name: Run Markdown Lint
        run: pnpm exec nx-cloud record -- pnpm run lint-markdown

      - name: Run Stylelint
        run: pnpm exec nx-cloud record -- pnpm --dir packages/website run stylelint

      - name: Run Dedupe Check
        run: pnpm exec nx-cloud record -- pnpm run deduplicate

      # Nx commands below distribute their tasks onto the Nx Agents. Task
      # ordering (e.g. everything depending on build) is modeled in the Nx
      # task graph, so agents schedule builds before dependent tasks.
      - name: Build
        run: pnpm exec nx run-many -t build --exclude website website-eslint

      - name: Typecheck
        run: pnpm exec nx run-many -t typecheck typecheck:tsgo

      # knip analyzes build outputs, so it runs after the distributed build
      # (task outputs are copied back to this job as they complete).
      - name: Run Knip
        run: pnpm exec nx-cloud record -- pnpm knip

      - name: Lint eslint-plugin
        run: pnpm lint --projects=eslint-plugin --concurrency=auto

      - name: Lint
        run: pnpm lint --exclude eslint-plugin

      - name: Are The Types Wrong?
        run: pnpm attw-check

      # The vitest shards of a project are separate task invocations, so they
      # are launched concurrently and each is picked up by an agent. Assignment
      # rules route the node18-configuration shards to the Node 18 agent tier.
      # Coverage is written to a per-shard directory so that the shards' output
      # directories do not clobber each other when copied back to this job.
      - name: Run eslint-plugin unit tests (sharded, Node 24 with coverage + Node 18)
        run: |
          pids=()
          for shard in 1 2 3 4; do
            pnpm exec nx test eslint-plugin -- --shard="$shard/4" --coverage --coverage.reportsDirectory="coverage/shard-$shard" &
            pids+=($!)
            pnpm exec nx test eslint-plugin --configuration=node18 -- --shard="$shard/4" &
            pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
        env:
          CI: true

      - name: Run unit tests with project service
        run: pnpm exec nx run-many -t test --configuration=project-service --projects=eslint-plugin-internal,typescript-estree --coverage=false
        env:
          CI: true

      - name: Run integration tests
        run: pnpm run test-integration
        env:
          CI: true

      - name: Run unit tests
        run: pnpm exec nx affected -t test --exclude eslint-plugin integration-tests -- --coverage
        env:
          CI: true

      # generate-configs mutates the working tree and its check inspects the
      # local git status, so it must run on this machine, not on an agent.
      # It runs after all distributed commands so that any tree mutation it
      # makes cannot skew the hashes of subsequently issued tasks. The
      # step-level NX_CI_EXECUTION_ENV opts it out of distribution via the
      # overrides in .nx/ci-config.yaml (it is listed in lifecycle.stop-after,
      # so the CI run stays open until it completes).
      - name: Generate configs
        id: generate_configs
        run: pnpm exec nx run generate-configs
        env:
          NX_CI_EXECUTION_ENV: 'ubuntu-latest'
          NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'
      - run: git status --porcelain
      - if: failure() && steps.generate_configs.outcome == 'failure'
        run: echo "Outdated result detected from pnpm run generate-configs. Please check in any file changes."

      - name: Store coverage for uploading
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributed-coverage
          path: packages/*/coverage/**/lcov.info
          if-no-files-found: ignore
          # Sadly 1 day is the minimum
          retention-days: 1

  ast_spec_snapshots_clean:
    name: Verify ast-spec snapshots are clean
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    needs: [affected-for-github-hosted-tests]
    if: ${{ contains(fromJson(needs['affected-for-github-hosted-tests'].outputs.unit_tests_packages), 'ast-spec') }}
    runs-on: ubuntu-latest
    env:
      NX_CI_EXECUTION_ENV: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Build
        uses: ./.github/actions/prepare-build

      - name: Delete all ast-spec fixture snapshots
        run: pnpm exec nx run ast-spec:clean-fixtures

      - name: Regenerate ast-spec fixture snapshots
        run: pnpm exec nx test ast-spec -u
        env:
          CI: true

      - name: Fail if regenerating snapshots produced a diff
        run: |
          changes="$(git status --porcelain -- packages/ast-spec/src)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Regenerating ast-spec fixture snapshots from scratch produced a different set of files than what is committed. This means some snapshot files are stale/orphaned/missing in git. Run 'pnpm exec nx run ast-spec:clean-fixtures && pnpm exec nx test ast-spec' locally and commit the resulting changes."
            exit 1
          fi

  scope_manager_snapshots_clean:
    name: Verify scope-manager snapshots are clean
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    needs: [affected-for-github-hosted-tests]
    if: ${{ contains(fromJson(needs['affected-for-github-hosted-tests'].outputs.unit_tests_packages), 'scope-manager') }}
    runs-on: ubuntu-latest
    env:
      NX_CI_EXECUTION_ENV: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Build
        uses: ./.github/actions/prepare-build

      - name: Delete all scope-manager fixture snapshots
        run: pnpm exec nx run scope-manager:clean-fixtures

      - name: Regenerate scope-manager fixture snapshots
        run: pnpm exec nx test scope-manager -u
        env:
          CI: true

      - name: Fail if regenerating snapshots produced a diff
        run: |
          changes="$(git status --porcelain -- packages/scope-manager/tests/fixtures)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Regenerating scope-manager fixture snapshots from scratch produced a different set of files than what is committed. This means some snapshot files are stale/orphaned/missing in git. Run 'pnpm exec nx run scope-manager:clean-fixtures && pnpm exec nx test scope-manager' locally and commit the resulting changes."
            exit 1
          fi

  # The Linux legs of the eslint-plugin shards (Node 24 with coverage, and
  # Node 18 via `test --configuration=node18`) run distributed on Nx Agents in
  # the `main` job; this job only covers the Windows-specific runs.
  plugin_unit_tests:
    # Note -- intentionally use the same name as unit_tests just so everything looks uniform in the checks section
    name: Run Unit Tests on Windows
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    needs: [affected-for-github-hosted-tests]
    if: ${{ needs['affected-for-github-hosted-tests'].outputs.is_plugin_affected == 'true' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # just run on the latest supported version on Windows; the Nx Agents
        # runs cover the oldest supported version on Linux
        node-version: [24]
        package:
          [
            { name: 'eslint-plugin', params: '--shard=1/4' },
            { name: 'eslint-plugin', params: '--shard=2/4' },
            { name: 'eslint-plugin', params: '--shard=3/4' },
            { name: 'eslint-plugin', params: '--shard=4/4' },
          ]
    env:
      NX_CI_EXECUTION_ENV: 'windows-latest - Node ${{ matrix.node-version }}'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build
        uses: ./.github/actions/prepare-build

      # we don't collect coverage on Windows so that the runs are faster
      - name: Run unit tests for ${{ matrix.package.name }}
        run: pnpm exec nx test ${{ matrix.package.name }} -- ${{ matrix.package.params }}
        env:
          CI: true

  # Linux (with coverage) unit tests run distributed on Nx Agents in the `main`
  # job; this job only covers the Windows-specific runs.
  unit_tests:
    name: Run Unit Tests on Windows
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    needs: [affected-for-github-hosted-tests]
    if: ${{ needs['affected-for-github-hosted-tests'].outputs.windows_unit_tests_packages != '[]' && needs['affected-for-github-hosted-tests'].outputs.windows_unit_tests_packages != '' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # note: do not run these packages on the oldest supported node versions -- we assume that the plugin tests have enough e2e coverage to prove everything works on the lowest node version
        node-version: [24]
        package: ${{ fromJson(needs['affected-for-github-hosted-tests'].outputs.windows_unit_tests_packages) }}
    env:
      NX_CI_EXECUTION_ENV: 'windows-latest - Node ${{ matrix.node-version }}'
      COLLECT_COVERAGE: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build
        uses: ./.github/actions/prepare-build

      # we don't collect coverage on Windows so that the runs are faster
      - name: Run unit tests for ${{ matrix.package }}
        run: pnpm exec nx test "$PACKAGE"
        env:
          CI: true
          PACKAGE: ${{ matrix.package }}

  # Some test jobs are created dynamically and conditionally skipped (see affected-for-github-hosted-tests),
  # so they can't be marked in the branch ruleset as required.
  # This static job aggregates all other jobs and is the single check we require in the branch ruleset.
  required_checks:
    name: Required Checks
    if: ${{ always() }}
    needs:
      - affected-for-github-hosted-tests
      # Runs all distributed Nx tasks (build, typecheck, lint, attw-check,
      # unit + integration tests including the Node 18 and project-service
      # variants), recorded non-Nx checks (prettier, cspell, markdownlint,
      # stylelint, dedupe, knip) and the coordinator-local generate-configs
      # check via Nx Agents.
      - main

      # Temporarily make these optional until we figure out why it's sometimes failing in CI.
      # - ast_spec_snapshots_clean
      # - scope_manager_snapshots_clean
      - plugin_unit_tests
      - unit_tests
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  upload_coverage:
    name: Upload Codecov Coverage
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    # All coverage (including the eslint-plugin per-shard reports) is produced
    # by the distributed unit tests in the `main` job.
    needs: [main]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download coverage reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: coverage

      - name: Publish code coverage report
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/**/lcov.info
          flags: unittest
          name: codecov
