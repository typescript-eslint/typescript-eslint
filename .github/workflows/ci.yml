# NOTE: The name of this workflow is significant - it is used as the identifier for the workflow_run trigger in the release workflow
name: CI

on:
  push:
    branches:
      - main
  # NOTE: Never use pull_request_target here because that would populate secrets for forks
  pull_request:
    branches:
      - '**'
  merge_group:

concurrency:
  group: '${{ github.workflow }} - ${{ github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PRIMARY_NODE_VERSION: 24
  # Value will be controlled via GitHub environment (called "main") secret, will be read-write for main branch, read-only for other branches
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  # This increases the verbosity of the logs for everything, including Nx Cloud, but will hopefully surface more info about recent lint failures
  NX_VERBOSE_LOGGING: false

defaults:
  run:
    shell: bash

#
# Workflow for how the CI spawns jobs:
# 1) Run the install and cache the install artefacts
# 2) Run the build to populate the Nx Cloud remote cache
#    - In parallel we also any steps that don't need the build (like prettier)
# 3) Run the steps that depend on the build
#

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  install:
    name: Checkout and Install
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    runs-on: ubuntu-latest
    env:
      NX_CI_EXECUTION_ENV: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

  build:
    name: Build All Packages
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    needs: [install]
    runs-on: ubuntu-latest
    permissions:
      actions: read # to find the last successful run of this workflow (nrwl/nx-set-shas)
      contents: read # to fetch code (actions/checkout)
      pull-requests: read # to resolve the base of a merge group (nrwl/nx-set-shas)
    env:
      NX_CI_EXECUTION_ENV: 'ubuntu-latest'
    outputs:
      is_plugin_affected: ${{ steps.filter.outputs.is_plugin_affected }}
      unit_tests_matrix: ${{ steps.filter.outputs.unit_tests_matrix }}
      snapshot_packages: ${{ steps.filter.outputs.snapshot_packages }}
      project_service_packages: ${{ steps.filter.outputs.project_service_packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      # Sets NX_BASE and NX_HEAD, used by `nx show projects --affected`
      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Get affected projects for tests
        id: affected
        run: |
          affected=$(pnpm exec nx show projects --affected --withTarget=test --json)

          echo "affected=$affected" >> "$GITHUB_OUTPUT"

      # We want to skip non-affected packages, but GH Actions doesn't support `contains(affected, matrix.package)` in `if` conditions,
      # so we're creating the whole matrix dynamically instead.
      - name: Create test matrices from affected projects
        id: filter
        run: node tools/scripts/generate-ci-test-matrices.mts
        env:
          AFFECTED: ${{ steps.affected.outputs.affected }}

      # Downstream jobs don't restore these outputs from disk -- their Nx targets depend on `build`
      # and pull it from the Nx Cloud remote cache, which this job populates.
      - name: Build
        run: pnpm exec nx run-many --target=build --parallel --exclude=website --exclude=website-eslint

  generate_configs:
    name: Generate Configs
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    needs: [build]
    runs-on: ubuntu-latest
    env:
      NX_CI_EXECUTION_ENV: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - run: pnpm exec nx run generate-configs
      - run: git status --porcelain
      - if: failure()
        run: echo "Outdated result detected from pnpm run generate-configs. Please check in any file changes."

  lint_without_build:
    name: Lint without build
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    needs: [install]
    runs-on: ubuntu-latest
    env:
      NX_CI_EXECUTION_ENV: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - parallel:
          - name: Run Spell Check
            run: pnpm run check-spelling

          - name: Run Format Check
            run: pnpm run check-format

          - name: Run Markdown Lint
            run: pnpm run lint-markdown

          - name: Run Stylelint
            run: pnpm run stylelint
            working-directory: packages/website

          - name: Run Deduplicate Check
            run: pnpm run deduplicate

  lint_with_build:
    name: Lint with build
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    # because we lint with our own tooling, we need to build
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lint-task: ['typecheck', 'typecheck:tsgo', 'knip']
    env:
      NX_CI_EXECUTION_ENV: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      # knip runs outside of Nx, but loads config files (e.g. the website's docusaurus config) that import built packages
      - name: Build
        if: matrix.lint-task == 'knip'
        run: pnpm build

      - name: Run Check
        run: pnpm ${{ matrix.lint-task }}

  attw:
    name: Are The Types Wrong?
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    needs: [build]
    runs-on: ubuntu-latest
    env:
      NX_CI_EXECUTION_ENV: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Run Check
        run: pnpm attw-check

  # Note -- intentionally use the same name as lint_with_build just so everything looks uniform in the checks section
  lint_with_build_eslint:
    name: Lint with build
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    # because we lint with our own tooling, we need to build
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/4'
            args: '--concurrency=auto'
            projects:
              - eslint-plugin

          - shard: '2/4'
            args: ''
            projects:
              - ast-spec
              - utils
              - scope-manager
              - eslint-plugin-internal

          - shard: '3/4'
            args: ''
            projects:
              - typescript-estree
              - types
              - website
              - rule-tester
              - visitor-keys

          - shard: '4/4'
            args: ''
            projects:
              - parser
              - type-utils
              - rule-schema-to-typescript-types
              - typescript-eslint
              - repo
              - website-eslint
              - integration-tests
              - project-service
    env:
      NX_CI_EXECUTION_ENV: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - run: pnpm lint --projects=${{ join(matrix.projects, ',') }} ${{ matrix.args }}

  integration_tests:
    name: Run integration tests on primary Node.js version
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    needs: [build]
    runs-on: ubuntu-latest
    env:
      NX_CI_EXECUTION_ENV: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Run integration tests
        run: pnpm run test-integration
        env:
          CI: true

  snapshots_clean:
    name: Verify snapshots are clean
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    needs: [build]
    if: ${{ needs.build.outputs.snapshot_packages != '[]' && needs.build.outputs.snapshot_packages != '' }}
    runs-on: ubuntu-latest
    env:
      NX_CI_EXECUTION_ENV: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Delete all ast-spec fixture snapshots
        id: ast_spec_clean
        if: ${{ contains(fromJson(needs.build.outputs.snapshot_packages), 'ast-spec') }}
        run: pnpm exec nx run ast-spec:clean-fixtures

      - name: Regenerate ast-spec fixture snapshots
        if: ${{ steps.ast_spec_clean.outcome == 'success' }}
        run: pnpm exec nx test ast-spec -u
        env:
          CI: true

      - name: Fail if regenerating ast-spec snapshots produced a diff
        if: ${{ steps.ast_spec_clean.outcome == 'success' }}
        run: |
          changes="$(git status --porcelain -- packages/ast-spec/src)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Regenerating ast-spec fixture snapshots from scratch produced a different set of files than what is committed. This means some snapshot files are stale/orphaned/missing in git. Run 'pnpm exec nx run ast-spec:clean-fixtures && pnpm exec nx test ast-spec' locally and commit the resulting changes."
            exit 1
          fi

      - name: Delete all scope-manager fixture snapshots
        id: scope_manager_clean
        if: ${{ !cancelled() && contains(fromJson(needs.build.outputs.snapshot_packages), 'scope-manager') }}
        run: pnpm exec nx run scope-manager:clean-fixtures

      - name: Regenerate scope-manager fixture snapshots
        if: ${{ !cancelled() && steps.scope_manager_clean.outcome == 'success' }}
        run: pnpm exec nx test scope-manager -u
        env:
          CI: true

      - name: Fail if regenerating scope-manager snapshots produced a diff
        if: ${{ !cancelled() && steps.scope_manager_clean.outcome == 'success' }}
        run: |
          changes="$(git status --porcelain -- packages/scope-manager/tests/fixtures)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Regenerating scope-manager fixture snapshots from scratch produced a different set of files than what is committed. This means some snapshot files are stale/orphaned/missing in git. Run 'pnpm exec nx run scope-manager:clean-fixtures && pnpm exec nx test scope-manager' locally and commit the resulting changes."
            exit 1
          fi

  plugin_unit_tests:
    # Note -- intentionally use the same name as unit_tests just so everything looks uniform in the checks section
    name: Run Unit Tests
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    needs: [build]
    if: ${{ needs.build.outputs.is_plugin_affected == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # just run on the oldest and latest supported versions and assume the intermediate versions are good
        node-version: [18, 24]
        package:
          [
            { name: 'eslint-plugin', params: '--shard=1/4' },
            { name: 'eslint-plugin', params: '--shard=2/4' },
            { name: 'eslint-plugin', params: '--shard=3/4' },
            { name: 'eslint-plugin', params: '--shard=4/4' },
          ]
        # Windows CI skips the rules tests, so eslint-plugin runs with other packages in the grouped unit tests job.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ matrix.node-version }}

      # collect coverage on just the primary node version and on linux
      # we don't collect coverage on the old node versions or other OSs so that they run faster
      - name: Run unit tests with coverage for ${{ matrix.package.name }}
        if: env.PRIMARY_NODE_VERSION == matrix.node-version && matrix.os == 'ubuntu-latest'
        run: pnpm exec nx test ${{ matrix.package.name }} -- ${{ matrix.package.params }} --coverage
        env:
          CI: true
      - name: Run unit tests for ${{ matrix.package.name }}
        if: env.PRIMARY_NODE_VERSION != matrix.node-version || matrix.os != 'ubuntu-latest'
        run: pnpm exec nx test ${{ matrix.package.name }} -- ${{ matrix.package.params }}
        env:
          CI: true

      - name: Upload coverage to Codecov
        if: env.PRIMARY_NODE_VERSION == matrix.node-version && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/${{ matrix.package.name }}/coverage/lcov.info
          flags: ${{ matrix.package.name }}
          name: ${{ matrix.package.name }}-${{ strategy.job-index }}

  unit_tests:
    name: Run Unit Tests (${{ matrix.os }}, ${{ matrix.name }})
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    needs: [build]
    if: ${{ needs.build.outputs.unit_tests_matrix != '[]' && needs.build.outputs.unit_tests_matrix != '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # note: do not run these packages on the oldest supported node versions -- we assume that the plugin tests have enough e2e coverage to prove everything works on the lowest node version
        include: ${{ fromJson(needs.build.outputs.unit_tests_matrix) }}
    env:
      NX_CI_EXECUTION_ENV: '${{ matrix.os }} - ${{ matrix.name }}'
      COLLECT_COVERAGE: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      # collect coverage on just linux
      # we don't collect coverage on other OSs so that they run faster
      - name: Run unit tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm exec nx run-many -t test --projects="$PROJECTS" --coverage
        env:
          CI: true
          PROJECTS: ${{ join(matrix.projects, ',') }}
      - name: Run unit tests
        if: matrix.os != 'ubuntu-latest'
        run: pnpm exec nx run-many -t test --projects="$PROJECTS"
        env:
          CI: true
          PROJECTS: ${{ join(matrix.projects, ',') }}

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/*/coverage/lcov.info
          flags: ${{ join(matrix.projects, ',') }}
          name: ${{ join(matrix.projects, '-') }}

  unit_tests_project_service:
    name: Run Unit Tests with Project Service (${{ matrix.backend }})
    environment: ${{ (github.repository == 'typescript-eslint/typescript-eslint' && github.ref == 'refs/heads/main') && 'main' || '' }} # Have to specify per job
    needs: [build]
    if: ${{ needs.build.outputs.project_service_packages != '[]' && needs.build.outputs.project_service_packages != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [classic, native]
    env:
      NX_CI_EXECUTION_ENV: 'ubuntu-latest'
      COLLECT_COVERAGE: false,
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install
        uses: ./.github/actions/prepare-install
        with:
          node-version: 22
      - name: Run unit tests
        if: matrix.backend == 'classic'
        run: pnpm exec nx run-many -t test --projects="$PROJECTS" --coverage=false
        env:
          CI: true
          TYPESCRIPT_ESLINT_PROJECT_SERVICE: true
          PROJECTS: ${{ join(fromJson(needs.build.outputs.project_service_packages), ',') }}

      # The native backend is only reached through typescript-estree's built
      # output, so its coverage is collected from dist and mapped back to src.
      - name: Run unit tests with native backend coverage
        if: matrix.backend == 'native'
        run: pnpm exec nx run-many -t test --projects="$PROJECTS" --coverage --coverage.allowExternal "--coverage.include=**/typescript-estree/dist/**" "--coverage.include=**/src/**" --coverage.reporter=lcov
        env:
          CI: true
          TYPESCRIPT_ESLINT_NATIVE_BACKEND: true
          TYPESCRIPT_ESLINT_PROJECT_SERVICE: true
          PROJECTS: ${{ format('{0},eslint-plugin', join(fromJson(needs.build.outputs.project_service_packages), ',')) }}

      - name: Make native backend coverage paths repository-relative
        id: native-coverage
        if: matrix.backend == 'native'
        run: |
          reports=()
          for report in packages/*/coverage/lcov.info; do
            package="$(dirname "$(dirname "$report")")"
            sed -i -E "s#^SF:\.\./#SF:packages/#; s#^SF:src/#SF:${package}/src/#" "$report"
            reports+=("$report")
          done
          echo "files=$(IFS=,; echo "${reports[*]}")" >> "$GITHUB_OUTPUT"

      - name: Upload native backend coverage to Codecov
        if: matrix.backend == 'native'
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.native-coverage.outputs.files }}
          flags: native-backend
          name: native-backend

  # Some test jobs are created dynamically and conditionally skipped (see the affected projects step in the build job),
  # so they can't be marked in the branch ruleset as required.
  # This static job aggregates all other jobs and is the single check we require in the branch ruleset.
  required_checks:
    name: Required Checks
    if: ${{ always() }}
    needs:
      - install
      - attw
      - build
      - generate_configs
      - lint_without_build
      - lint_with_build
      - lint_with_build_eslint
      - integration_tests
      - snapshots_clean
      - plugin_unit_tests
      - unit_tests
      - unit_tests_project_service
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
