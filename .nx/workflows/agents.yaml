launch-templates:
  linux-medium-js:
    resource-class: 'docker_linux_amd64/medium'
    image: 'ubuntu22.04-node24.14-v1'
    init-steps:
      - name: Checkout
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml'

      - name: Restore Node Modules Cache
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/cache/main.yaml'
        inputs:
          key: 'pnpm-lock.yaml'
          paths: 'node_modules'
          base-branch: 'main'

      # Mirrors .github/actions/prepare-install: husky and the postinstall
      # build must not run during CI installs. The pnpm version is pinned via
      # the "packageManager" field in package.json and resolved by corepack.
      - name: Install Node Modules
        script: |
          corepack enable
          pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          HUSKY: '0'
          SKIP_POSTINSTALL: 'true'

      - name: Set Nx Cloud CI execution environment name
        script: |
          echo "NX_CI_EXECUTION_ENV=nx-agents-linux-node24" >> "$NX_CLOUD_ENV"

  # Runs the test tasks that must execute on the oldest supported Node.js
  # version (eslint-plugin `test --configuration=node18` shards and the
  # project-service test variants). Routing is enforced by the assignment
  # rules in .nx/ci-config.yaml.
  linux-medium-node18-js:
    # Larger class than the Node 24 tier: Node 18 has no module compile cache,
    # so the first type-aware test of each vitest file pays a TS program
    # initialization cost that exceeds the 10s test timeout on `medium` (the
    # legacy GitHub-hosted runners for these shards had 4 vCPUs).
    resource-class: 'docker_linux_amd64/large'
    image: 'ubuntu22.04-node24.14-v1'
    init-steps:
      - name: Checkout
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml'

      - name: Install Node.js 18
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-node/main.yaml'
        inputs:
          node_version: '18'

      # NOTE: intentionally no shared node_modules cache here — this template
      # installs under a different Node.js major than linux-medium-js and must
      # not restore a node_modules tree produced under Node 24.
      - name: Install Node Modules
        script: |
          corepack enable
          pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          HUSKY: '0'
          SKIP_POSTINSTALL: 'true'

      - name: Set Nx Cloud CI execution environment name
        script: |
          echo "NX_CI_EXECUTION_ENV=nx-agents-linux-node18" >> "$NX_CLOUD_ENV"
