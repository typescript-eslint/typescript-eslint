# Nx Cloud CI configuration, read by every Nx Cloud command.
# Agents are provisioned by `nx-cloud start-nx-agents` in the `main` job of
# .github/workflows/ci.yml; launch templates live in .nx/workflows/agents.yaml.

lifecycle:
  # List every distributed target plus the coordinator-local generate-configs
  # check so the run does not complete before all work is done.
  stop-after:
    - build
    - copy-ast-spec
    - typecheck
    - typecheck:tsgo
    - lint
    - test
    - attw-check
    - generate-configs
  # Never end the run early on a task failure: the legacy pipeline ran all
  # jobs with fail-fast disabled so every failure is reported in one pass.
  # Failing tasks still fail the nx command (and therefore the CI job).
  fail-after: 0
  heartbeat: true

dte:
  # Distribution is opt-in via the `nx-agents-main` override below. This keeps
  # local development and every non-coordinator CI job (Windows matrices,
  # snapshot checks) from ever attempting distributed execution, since they
  # also read this file.
  enabled-by-default: false
  distribute-on: 13 linux-medium-js, 4 linux-medium-node18-js

  # IMPORTANT: task hashes are computed on the coordinator (Node 24), so a
  # task that lands on the wrong agent tier would poison the remote cache
  # silently. The rules below must therefore cover EVERY distributed target —
  # a task that matches no rule may be assigned to ANY tier, including the
  # Node 18 one. If a new target starts being distributed (including as a
  # task-graph dependency), it MUST be added to the second rule.
  assignment-rules:
    # Test variants that must execute under Node 18. This rule is more
    # specific (target + configuration) than the catch-all below, so it takes
    # precedence for these tasks.
    - targets:
        - test
      configurations:
        - node18
        - project-service
      run-on:
        - agent: linux-medium-node18-js

    # Everything else runs on the default Node 24 tier.
    - targets:
        - build
        - copy-ast-spec
        - lint
        - test
        - typecheck
        - 'typecheck:tsgo'
        - attw-check
      run-on:
        - agent: linux-medium-js

nx-agents:
  # NX_-prefixed variables are forwarded automatically; CI is a declared input
  # of the vitest test targets so it must reach the agents explicitly.
  with-env-vars:
    - CI

overrides:
  # The Nx Agents coordinator job (see NX_CI_EXECUTION_ENV in ci.yml) is the
  # only environment that distributes tasks.
  nx-agents-main:
    dte:
      enabled-by-default: true
