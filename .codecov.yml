codecov:
  require_ci_to_pass: no
  notify:
    wait_for_ci: no

coverage:
  status:
    patch:
      default:
        target: 90%
    project:
      default:
        target: auto
        threshold: 2%

comment:
  layout: diff, flags, files
  require_changes: true

# Each package uploads coverage under its own flag (see ci.yml).
# PRs only run tests for affected packages, so carry forward the most recent
# coverage for any package whose tests didn't run rather than treating it as 0%.
flag_management:
  default_rules:
    carryforward: true
